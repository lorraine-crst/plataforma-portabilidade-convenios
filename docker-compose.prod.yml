services:
  dynamodb:
    ports: !reset []
    restart: unless-stopped

  central:
    ports: !reset []
    restart: unless-stopped

  backend:
    ports: !reset []
    restart: unless-stopped

  frontend:
    ports: !reset []
    restart: unless-stopped

  proxy:
    image: caddy:2.10-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Defina DOMAIN no arquivo .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config: