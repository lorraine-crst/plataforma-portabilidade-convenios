spring:
  application:
    name: portability
  config:
    import: optional:file:../.env[.properties]

app:
  central:
    url: ${CENTRAL_URL:http://localhost:4000}
    connect-timeout: 2s
    read-timeout: 5s
  dynamo:
    endpoint: ${DYNAMO_ENDPOINT:http://localhost:8000}
    region: us-east-1
    create-tables: true
  secrets:
    jwt-secret: ${JWT_SECRET:}
    hmac-secret: ${HMAC_SECRET:}
    