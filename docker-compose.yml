name: nuvola

services:
  dynamodb:
    image: amazon/dynamodb-local:3.3.2
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    ports:
      - "8000:8000"

  central:
    build: ./mock-central
    ports:
      - "4000:4000"

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      CENTRAL_URL: http://central:4000
      DYNAMO_ENDPOINT: http://dynamodb:8000
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env (veja o .env.example)}
      HMAC_SECRET: ${HMAC_SECRET:?Defina HMAC_SECRET no arquivo .env (veja o .env.example)}
    depends_on:
      dynamodb:
        condition: service_started
      central:
        condition: service_started
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy